<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe — Cart & Checkout | Funny-Friends</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #333; color: #555; min-height: 100vh; }
    .page-bg { position: fixed; inset: 0; background: #e8e8e8; opacity: 0.3; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: flex-end; }
    .drawer { width: 420px; background: #fff; height: 100%; padding: 24px; display: flex; flex-direction: column; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .drawer-title { width: 120px; height: 20px; background: #ccc; }
    .close { width: 32px; height: 32px; border-radius: 50%; background: #eee; border: 1px solid #ccc; }
    .progress { margin-bottom: 24px; }
    .progress-label { width: 100%; height: 12px; background: #eee; margin-bottom: 8px; font-size: 10px; }
    .progress-bar { width: 100%; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    .progress-fill { width: 60%; height: 100%; background: #ccc; }
    .cart-item { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid #eee; }
    .item-img { width: 64px; height: 80px; background: #f0f0f0; border: 1px dashed #bbb; flex-shrink: 0; }
    .item-info .block { height: 12px; margin-bottom: 6px; background: #eee; }
    .sample-select { width: 100%; height: 44px; background: #f5f5f5; border: 1px dashed #bbb; margin: 16px 0; font-size: 11px; display:flex;align-items:center;padding:0 12px; }
    .total { margin-top: auto; padding-top: 24px; border-top: 2px solid #ddd; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .total-row .block { height: 14px; background: #eee; }
    .checkout-btn { width: 100%; height: 48px; background: #ccc; margin-top: 16px; }
    .quick-pay { display: flex; gap: 8px; margin-top: 12px; }
    .pay-btn { flex: 1; height: 40px; background: #eee; border: 1px solid #ccc; font-size: 10px; display:flex;align-items:center;justify-content:center; }

    .checkout-flow { max-width: 800px; margin: 40px auto; background: #fff; padding: 48px; border-radius: 8px; }
    .steps { display: flex; gap: 24px; margin-bottom: 48px; }
    .step { flex: 1; text-align: center; padding: 16px; border: 2px solid #ddd; }
    .step.active { border-color: #999; background: #f5f5f5; }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: #ccc; margin: 0 auto 8px; }
    .form-field { width: 100%; height: 44px; background: #f5f5f5; border: 1px solid #ddd; margin-bottom: 12px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .annotation { position: fixed; top: 12px; right: 12px; background: #fff; color: #333; padding: 8px 16px; border-radius: 4px; font-size: 12px; z-index: 10; }
    .back { position: fixed; top: 12px; left: 12px; background: #fff; padding: 8px 16px; border-radius: 4px; font-size: 12px; text-decoration: none; color: #333; border: 1px solid #ccc; z-index: 10; }
    h2 { font-size: 14px; margin: 48px 0 16px; color: #fff; text-align: center; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Wireframes</a>
  <div class="annotation">Cart Drawer + 3-Step Checkout</div>

  <h2>Slide-over Cart Drawer</h2>
  <div class="overlay">
    <div class="drawer">
      <div class="drawer-header"><div class="drawer-title"></div><div class="close"></div></div>
      <div class="progress">
        <div class="progress-label">До безкоштовної доставки залишилося 400 ₴</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
      <div class="cart-item">
        <div class="item-img"></div>
        <div class="item-info"><div class="block" style="width:140px"></div><div class="block" style="width:80px"></div><div class="block" style="width:60px"></div></div>
      </div>
      <div class="cart-item">
        <div class="item-img"></div>
        <div class="item-info"><div class="block" style="width:140px"></div><div class="block" style="width:80px"></div><div class="block" style="width:60px"></div></div>
      </div>
      <div class="sample-select">Оберіть подарунковий пробник ▼</div>
      <div class="total">
        <div class="total-row"><div class="block" style="width:60px"></div><div class="block" style="width:80px"></div></div>
        <div class="total-row"><div class="block" style="width:80px"></div><div class="block" style="width:60px;background:#ccc"></div></div>
        <div class="checkout-btn"></div>
        <div class="quick-pay"><div class="pay-btn"> Apple Pay</div><div class="pay-btn">Google Pay</div><div class="pay-btn">Картка</div></div>
      </div>
    </div>
  </div>

  <h2 style="margin-top:600px">3-Step Checkout</h2>
  <div class="checkout-flow">
    <div class="steps">
      <div class="step active"><div class="step-num">1</div>Адреса</div>
      <div class="step"><div class="step-num">2</div>Доставка</div>
      <div class="step"><div class="step-num">3</div>Оплата</div>
    </div>
    <div class="form-grid">
      <div class="form-field"></div><div class="form-field"></div>
      <div class="form-field" style="grid-column:span 2"></div>
      <div class="form-field"></div><div class="form-field"></div>
    </div>
    <div style="width:160px;height:44px;background:#ccc;margin-top:24px"></div>
  </div>
</body>
</html>
