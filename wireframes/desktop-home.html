<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe — Home Desktop | Funny-Friends</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #e8e8e8; color: #555; }
    .wf { max-width: 1440px; margin: 0 auto; background: #fff; min-height: 100vh; }

    /* Wireframe utilities */
    .ph { background: repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 4px, #e8e8e8 4px, #e8e8e8 8px); border: 2px dashed #bbb; display: flex; align-items: center; justify-content: center; color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .block { background: #eee; border: 1px solid #ccc; }
    .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }

    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 48px; border-bottom: 2px solid #ddd; height: 72px; }
    .logo { width: 140px; height: 32px; background: #ccc; }
    .nav { display: flex; gap: 24px; }
    .nav span { width: 60px; height: 12px; background: #ddd; display: block; }
    .header-actions { display: flex; gap: 16px; align-items: center; }
    .search-bar { width: 240px; height: 36px; background: #f5f5f5; border: 1px dashed #bbb; border-radius: 18px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ccc; background: #f5f5f5; }
    .cart-btn { width: 100px; height: 36px; background: #ddd; border-radius: 4px; }

    /* Hero */
    .hero { height: 600px; position: relative; }
    .hero .ph { height: 100%; }
    .hero-content { position: absolute; bottom: 80px; left: 48px; }
    .hero-content .block { width: 400px; height: 48px; margin-bottom: 16px; }
    .hero-content .block-sm { width: 280px; height: 16px; margin-bottom: 32px; background: #e0e0e0; }
    .hero-btns { display: flex; gap: 12px; }
    .hero-btns .block { width: 140px; height: 44px; }

    /* Section */
    .section { padding: 64px 48px; border-bottom: 1px solid #eee; }
    .section-title { width: 300px; height: 32px; background: #ddd; margin-bottom: 8px; }
    .section-sub { width: 400px; height: 14px; background: #eee; margin-bottom: 32px; }

    /* Olfactory families */
    .families { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
    .family-card { height: 160px; }

    /* Product grid */
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .product-card { border: 1px solid #ddd; padding: 16px; }
    .product-img { height: 280px; margin-bottom: 16px; }
    .product-title { width: 80%; height: 16px; background: #ddd; margin-bottom: 8px; }
    .product-meta { width: 60%; height: 12px; background: #eee; margin-bottom: 12px; }
    .volume-toggle { display: flex; gap: 4px; margin-bottom: 12px; }
    .volume-toggle span { width: 40px; height: 24px; background: #eee; border: 1px solid #ccc; }
    .product-footer { display: flex; justify-content: space-between; align-items: center; }
    .price { width: 60px; height: 20px; background: #ddd; }
    .add-btn { width: 100px; height: 36px; background: #ccc; }

    /* Discovery builder */
    .discovery { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .discovery-visual { height: 400px; }
    .discovery-steps .block { height: 48px; margin-bottom: 12px; }

    /* Ingredients + Heritage */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
    .two-col .ph { height: 300px; }

    /* Reviews */
    .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .review-card { padding: 24px; border: 1px solid #ddd; }
    .review-card .block { height: 12px; margin-bottom: 8px; }
    .review-card .block-lg { height: 60px; background: #f5f5f5; margin-top: 12px; }

    /* Footer trust */
    .trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; background: #f5f5f5; padding: 48px; }
    .trust-item { text-align: center; }
    .trust-icon { width: 48px; height: 48px; border-radius: 50%; background: #ddd; margin: 0 auto 12px; }
    .trust-item .block { width: 120px; height: 14px; background: #ccc; margin: 0 auto 8px; }
    .trust-item .block-sm { width: 180px; height: 10px; background: #e0e0e0; margin: 0 auto; }

    /* Footer */
    .footer { padding: 48px; background: #333; color: #999; font-size: 12px; text-align: center; }

    .annotation { position: fixed; top: 12px; right: 12px; background: #333; color: #fff; padding: 8px 16px; border-radius: 4px; font-size: 12px; }
    .back { position: fixed; top: 12px; left: 12px; background: #fff; padding: 8px 16px; border-radius: 4px; font-size: 12px; text-decoration: none; color: #333; border: 1px solid #ccc; }
  </style>
</head>
<body>
